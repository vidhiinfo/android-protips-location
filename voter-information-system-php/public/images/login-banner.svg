<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-label="Ballot box with voters, booth locations and statistics">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe7fb"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
  </defs>
  <!-- soft background shapes -->
  <circle cx="260" cy="190" r="165" fill="#ffffff" opacity=".07"/>
  <circle cx="260" cy="190" r="118" fill="#ffffff" opacity=".07"/>
  <!-- map pins (booths) -->
  <g opacity=".95">
    <path d="M88 92c0-15 12-27 27-27s27 12 27 27c0 21-27 47-27 47S88 113 88 92z" fill="#ff9933"/>
    <circle cx="115" cy="92" r="10" fill="#fff"/>
    <path d="M404 70c0-12 10-22 22-22s22 10 22 22c0 17-22 38-22 38s-22-21-22-38z" fill="#2fbf71"/>
    <circle cx="426" cy="70" r="8" fill="#fff"/>
    <path d="M430 220c0-9 7-16 16-16s16 7 16 16c0 13-16 28-16 28s-16-15-16-28z" fill="#ffffff" opacity=".85"/>
  </g>
  <!-- dashed route between booths -->
  <path d="M120 140 C 160 200, 200 210, 228 214" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 7" opacity=".55"/>
  <path d="M424 112 C 410 160, 370 180, 334 196" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 7" opacity=".55"/>
  <!-- bar chart card -->
  <g transform="translate(372 250)">
    <rect width="118" height="86" rx="12" fill="#ffffff" opacity=".95"/>
    <rect x="16" y="50" width="14" height="22" rx="3" fill="#86b6ef"/>
    <rect x="38" y="36" width="14" height="36" rx="3" fill="#5598e7"/>
    <rect x="60" y="24" width="14" height="48" rx="3" fill="#2a78d6"/>
    <rect x="82" y="14" width="14" height="58" rx="3" fill="#184f95"/>
    <path d="M16 20 L 44 16 L 66 10 L 98 4" fill="none" stroke="#ff9933" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- ballot paper going into the box -->
  <g transform="rotate(-8 262 120)">
    <rect x="222" y="58" width="80" height="104" rx="8" fill="url(#paper)" stroke="#c9d8f2" stroke-width="2"/>
    <rect x="236" y="76" width="34" height="6" rx="3" fill="#c9d8f2"/>
    <rect x="236" y="92" width="52" height="6" rx="3" fill="#c9d8f2"/>
    <circle cx="262" cy="128" r="17" fill="#138808"/>
    <path d="M253 128 l6 6 l12 -13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- ballot box -->
  <rect x="168" y="166" width="188" height="138" rx="14" fill="url(#box)"/>
  <rect x="168" y="166" width="188" height="30" rx="14" fill="#ffffff"/>
  <rect x="218" y="176" width="88" height="9" rx="4.5" fill="#1d3f7a"/>
  <rect x="168" y="268" width="188" height="10" fill="#ff9933" opacity=".9"/>
  <rect x="168" y="278" width="188" height="10" fill="#ffffff"/>
  <rect x="168" y="288" width="188" height="16" rx="0" fill="#138808" opacity=".9"/>
  <path d="M168 288 h188 v2 a14 14 0 0 1 -14 14 h-160 a14 14 0 0 1 -14 -14 z" fill="#138808" opacity=".9"/>
  <circle cx="262" cy="226" r="22" fill="none" stroke="#1d3f7a" stroke-width="3" opacity=".35"/>
  <g fill="#1d3f7a" opacity=".35">
    <circle cx="262" cy="204" r="2.2"/><circle cx="262" cy="248" r="2.2"/><circle cx="240" cy="226" r="2.2"/><circle cx="284" cy="226" r="2.2"/>
  </g>
  <!-- voters -->
  <g fill="#ffffff">
    <circle cx="62" cy="262" r="15"/><path d="M34 330c0-20 13-36 28-36s28 16 28 36z"/>
    <circle cx="112" cy="250" r="17" opacity=".92"/><path d="M80 330c0-24 15-42 32-42s32 18 32 42z" opacity=".92"/>
  </g>
  <g fill="#ffd8b0">
    <circle cx="62" cy="262" r="9" opacity=".0"/>
  </g>
  <!-- ground line -->
  <rect x="24" y="330" width="472" height="3" rx="1.5" fill="#ffffff" opacity=".35"/>
</svg>
