<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline | Voter Information System</title>
<style>
  :root { --bg: #f5f6fa; --fg: #1d2433; --muted: #5c6475; --brand: #0d6efd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141821; --fg: #e8ebf2; --muted: #9aa3b5; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 88px; height: 88px; } h1 { font-size: 1.3rem; margin: 16px 0 8px; } p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 12px 28px; font-size: 1rem; }
</style></head>
<body><main>
  <img src="images/app/icon-192.png" alt="">
  <h1>No internet connection</h1>
  <p>The Voter Information System needs the internet to show voter data.<br>नेटवर्क नहीं है। इंटरनेट चालू करके फिर कोशिश करें।</p>
  <button type="button" id="retry">Try again / फिर कोशिश करें</button>
</main>
<script src="js/offline.js"></script>
</body></html>
