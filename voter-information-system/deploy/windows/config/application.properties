# =====================================================================
# Production settings for Windows Server.
# Copy this folder next to the jar:  C:\VoterSystem\config\application.properties
# Spring Boot reads it automatically and it overrides the built-in defaults.
# Keep this file private (it contains passwords) - see the guide for folder permissions.
# =====================================================================

server.port=8080
# Only listen on this machine when IIS is the public front end (recommended). Remove to listen on all interfaces.
server.address=127.0.0.1
# Behind IIS: trust X-Forwarded-* headers so redirects use https://your-domain
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# ---------------- MySQL ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/voter_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=voter_app
spring.datasource.password=CHANGE_ME_DB_PASSWORD
# after running db/schema.sql use "validate" (tables are never changed automatically)
spring.jpa.hibernate.ddl-auto=validate

# ---------------- First administrator (created on first start only) ----------------
app.security.admin.username=admin
app.security.admin.password=CHANGE_ME_ADMIN_PASSWORD

# ---------------- Logs ----------------
logging.file.name=C:/VoterSystem/logs/voter-system.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=30

# ---------------- Optional: login page branding ----------------
