spring.application.name=voter-information-system
server.port=8080

# ---------------- MySQL ----------------
# Override with environment variables in production: DB_URL, DB_USERNAME, DB_PASSWORD
# characterEncoding + connectionCollation make every connection utf8mb4, so Hindi, Bengali, Urdu, Tamil... are stored correctly
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/voter_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:voter_app}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" creates / alters the voters table automatically.
# For a locked-down production DB run db/schema.sql once and set this to "validate".
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
# tables created by Hibernate use InnoDB + utf8mb4
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8

# ---------------- Languages ----------------
# UI texts: src/main/resources/messages*.properties (en, hi, bn, ur, mr, gu, pa, ta, te)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ---------------- First administrator ----------------
# Created on first start when no administrator exists; manage all other users under Admin > Users.
# Change it! The value may be plain text or pre-encoded, e.g. {bcrypt}$2a$10$...
app.security.admin.username=${ADMIN_USER:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin@123}

# ---------------- Uploads ----------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.servlet.session.timeout=30m
server.error.include-message=always

# The custom AssemblyAuthenticationProvider (username + password + assembly) is intentional
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
