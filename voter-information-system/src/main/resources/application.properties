spring.application.name=voter-information-system
server.port=8080

# ---------------- MySQL ----------------
# Override with environment variables in production: DB_URL, DB_USERNAME, DB_PASSWORD
# characterEncoding + connectionCollation make every connection utf8mb4, so Hindi, Bengali, Urdu, Tamil... are stored correctly
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/voter_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:voter_app}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" creates / alters the voters table automatically.
# For a locked-down production DB run db/schema.sql once and set this to "validate".
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
# tables created by Hibernate use InnoDB + utf8mb4
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8

# ---------------- Languages ----------------
# UI texts: src/main/resources/messages*.properties (en, hi, bn, ur, mr, gu, pa, ta, te)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ---------------- First administrator ----------------
# Created on first start when no administrator exists; manage all other users under Admin > Users.
# Change it! The value may be plain text or pre-encoded, e.g. {bcrypt}$2a$10$...
app.security.admin.username=${ADMIN_USER:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin@123}

# ---------------- Uploads ----------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.servlet.session.timeout=30m
server.error.include-message=always

# The custom AssemblyAuthenticationProvider (username + password + assembly) is intentional
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ---------------- SMS / WhatsApp ----------------
# Providers: SMS = log | twilio | http ; WhatsApp = log | twilio | meta.
# "log" is a dry run: messages are written to the log and marked sent, nothing leaves the server.
app.messaging.sms-provider=${SMS_PROVIDER:log}
app.messaging.whatsapp-provider=${WHATSAPP_PROVIDER:log}
app.messaging.country-code=+91
app.messaging.rate-per-second=${MSG_RATE:5}
# TRAI: promotional SMS only between 09:00 and 21:00
app.messaging.send-from=09:00
app.messaging.send-until=21:00
app.messaging.time-zone=Asia/Kolkata
# ECI silence period: no campaign messages from 48 h before poll day until poll day ends (current election)
app.messaging.enforce-silence-period=true
app.messaging.max-attempts=3
# Twilio (SMS and/or WhatsApp)
app.messaging.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.messaging.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.messaging.twilio.sms-from=${TWILIO_SMS_FROM:}
app.messaging.twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}
# WhatsApp Business Cloud API (Meta)
app.messaging.meta.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.messaging.meta.access-token=${WHATSAPP_ACCESS_TOKEN:}
# Generic HTTP SMS gateway (DLT) - see README for MSG91 / Textlocal / Fast2SMS examples
app.messaging.http.method=${SMS_HTTP_METHOD:GET}
app.messaging.http.url=${SMS_HTTP_URL:}
app.messaging.http.body=${SMS_HTTP_BODY:}
app.messaging.http.content-type=${SMS_HTTP_CONTENT_TYPE:application/x-www-form-urlencoded}
app.messaging.http.auth-header=${SMS_HTTP_AUTH_HEADER:}
app.messaging.http.sender-id=${SMS_SENDER_ID:}
app.messaging.http.entity-id=${SMS_DLT_ENTITY_ID:}
app.messaging.http.success-contains=${SMS_HTTP_SUCCESS:}

# ---------------- Users & roles ----------------
# app  = users/roles/permissions in this application's tables: app_users, roles, role_permissions, user_roles
# external = read users and role names from YOUR existing tables with the SQL below (same database, or set the url)
app.security.user-source=${USER_SOURCE:app}
# columns: username, password, enabled [, assembly_no] [, full_name]
app.security.external.users-query=${USERS_QUERY:select username, password, enabled, assembly_no, full_name from users where username = ?}
# one role name per row
app.security.external.roles-query=${ROLES_QUERY:select r.role_name from user_roles ur join users u on u.id = ur.user_id join roles r on r.id = ur.role_id where u.username = ?}
# hashes without a {id} prefix are checked with: bcrypt | pbkdf2 | scrypt | argon2 | SHA-256 | MD5 | noop
app.security.external.password-encoding=${USERS_PASSWORD_ENCODING:bcrypt}
# map external role names to application role codes, e.g.:
# app.security.external.role-map.SUPER_ADMIN=ADMIN
# app.security.external.role-map.DATA_ENTRY=OPERATOR
app.security.external.url=${USERS_DB_URL:}
app.security.external.username=${USERS_DB_USERNAME:}
app.security.external.password=${USERS_DB_PASSWORD:}

# ---------------- Login page branding ----------------
app.branding.banner-image=${BRAND_BANNER:/images/login-banner.svg}
app.branding.organisation=${BRAND_ORGANISATION:}
app.branding.logo=${BRAND_LOGO:}
