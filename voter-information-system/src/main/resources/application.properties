spring.application.name=voter-information-system
server.port=8080

# ---------------- MySQL ----------------
# Override with environment variables in production: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/voter_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:voter_app}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" creates / alters the voters table automatically.
# For a locked-down production DB run db/schema.sql once and set this to "validate".
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100

# ---------------- Login users ----------------
# Change these! Values may be plain text or pre-encoded, e.g. {bcrypt}$2a$10$...
app.security.admin.username=${ADMIN_USER:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin@123}
app.security.viewer.username=${VIEWER_USER:viewer}
app.security.viewer.password=${VIEWER_PASSWORD:viewer@123}

# ---------------- Uploads ----------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.servlet.session.timeout=30m
server.error.include-message=always
