<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${currentLang.code}" th:dir="${currentLang.rtl} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{account.changePassword})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container" style="max-width:500px">
    <h4 class="mb-3" th:text="#{account.changePassword}"></h4>
    <div th:if="${error}" class="alert alert-danger py-2" th:text="#{${error}}"></div>
    <form method="post" th:action="@{/account/password}" class="card card-body">
        <div class="mb-3"><label class="form-label" for="current" th:text="#{account.current}"></label>
            <input id="current" name="current" type="password" class="form-control" required autocomplete="current-password"></div>
        <div class="mb-3"><label class="form-label" for="np" th:text="#{account.new}"></label>
            <input id="np" name="newPassword" type="password" class="form-control" required minlength="8" autocomplete="new-password">
            <div class="form-text" th:text="#{validation.password}"></div></div>
        <div class="mb-3"><label class="form-label" for="cf" th:text="#{account.confirm}"></label>
            <input id="cf" name="confirm" type="password" class="form-control" required minlength="8" autocomplete="new-password"></div>
        <button class="btn btn-primary" th:text="#{common.save}"></button>
    </form>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
