<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${currentLang.code}" th:dir="${currentLang.rtl} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{admin.audit})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container-fluid px-3" style="max-width:1400px">
    <h4 class="mb-3"><i class="bi bi-journal-text"></i> <span th:text="#{admin.audit}"></span></h4>
    <form method="get" class="card card-body py-2 mb-3"><div class="row g-2 align-items-end">
        <div class="col-md-3"><label class="form-label small" th:text="#{login.username}"></label><input name="user" th:value="${user}" class="form-control form-control-sm"></div>
        <div class="col-md-3"><label class="form-label small" th:text="#{admin.action}"></label>
            <select name="action" class="form-select form-select-sm"><option value="" th:text="#{common.all}"></option>
                <option th:each="a : ${actions}" th:value="${a}" th:selected="${a == action}" th:text="#{${'audit.' + a}}"></option></select></div>
        <div class="col-md-3"><label class="form-label small" th:text="#{admin.entity}"></label>
            <select name="entity" class="form-select form-select-sm"><option value="" th:text="#{common.all}"></option>
                <option th:each="e : ${entities}" th:value="${e}" th:selected="${e == entity}" th:text="#{${'entity.' + e}}"></option></select></div>
        <div class="col-md-2"><button class="btn btn-sm btn-primary w-100" th:text="#{common.apply}"></button></div>
    </div></form>
    <div class="table-responsive bg-white border rounded"><table class="table table-sm table-striped mb-0">
        <thead class="table-light"><tr><th th:text="#{admin.time}"></th><th th:text="#{login.username}"></th><th th:text="#{admin.action}"></th>
            <th th:text="#{admin.entity}"></th><th>ID</th><th th:text="#{admin.details}"></th></tr></thead>
        <tbody>
            <tr th:if="${page.empty}"><td colspan="6" class="text-center text-muted py-4" th:text="#{common.noRecords}"></td></tr>
            <tr th:each="a : ${page.content}">
                <td class="text-nowrap small" th:text="${#temporals.format(a.at, 'dd-MM-yyyy HH:mm:ss')}"></td>
                <td th:text="${a.username}"></td>
                <td><span class="badge" th:classappend="${a.action == 'DELETE' or a.action == 'LOGIN_FAILED'} ? 'text-bg-danger' : 'text-bg-light border'" th:text="#{${'audit.' + a.action}}"></span></td>
                <td th:text="${a.entity} ? #{${'entity.' + a.entity}}"></td>
                <td class="small" th:text="${a.entityId}"></td>
                <td class="small" dir="auto" th:text="${a.details}"></td>
            </tr>
        </tbody></table></div>
    <nav th:if="${page.totalPages > 1}" class="mt-3 d-flex justify-content-center gap-2">
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${page.first} ? 'disabled'" th:href="@{/admin/audit(user=${user},action=${action},entity=${entity},page=${page.number - 1})}">&lsaquo;</a>
        <span class="small align-self-center" th:text="(${page.number} + 1) + ' / ' + ${page.totalPages}"></span>
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${page.last} ? 'disabled'" th:href="@{/admin/audit(user=${user},action=${action},entity=${entity},page=${page.number + 1})}">&rsaquo;</a>
    </nav>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
