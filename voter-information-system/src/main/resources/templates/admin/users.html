<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${currentLang.code}" th:dir="${currentLang.rtl} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{admin.users})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container-fluid px-3" style="max-width:1200px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex align-items-center mb-3">
        <h4 class="me-auto mb-0"><i class="bi bi-people"></i> <span th:text="#{admin.users}"></span></h4>
        <a class="btn btn-outline-secondary btn-sm me-2" th:href="@{/admin/roles}"><i class="bi bi-shield-check"></i> <span th:text="#{admin.roles}"></span></a>
        <a th:unless="${externalUsers}" class="btn btn-primary btn-sm" th:href="@{/admin/users/new}"><i class="bi bi-plus-lg"></i> <span th:text="#{common.add}"></span></a>
    </div>
    <div th:if="${externalUsers}" class="alert alert-info py-2" th:text="#{admin.externalUsers}"></div>
    <div th:unless="${externalUsers}" class="table-responsive bg-white border rounded"><table class="table table-striped table-hover mb-0 align-middle">
        <thead class="table-light"><tr><th th:text="#{login.username}"></th><th th:text="#{admin.fullName}"></th><th th:text="#{admin.roles}"></th>
            <th th:text="#{login.assembly}"></th><th th:text="#{admin.status}"></th><th th:text="#{admin.lastLogin}"></th><th></th></tr></thead>
        <tbody><tr th:each="i : ${items}">
            <td class="fw-semibold" th:text="${i.username}"></td><td th:text="${i.fullName}"></td>
            <td><span th:each="r : ${i.roles}" class="badge text-bg-secondary me-1" th:text="${r.name}" th:title="${r.code}"></span></td>
            <td th:text="${i.assemblyNo} ?: #{login.allAssemblies}"></td>
            <td><span th:class="${i.enabled} ? 'badge text-bg-success' : 'badge text-bg-danger'" th:text="${i.enabled} ? #{admin.active} : #{admin.disabled}"></span></td>
            <td class="small" th:text="${#temporals.format(i.lastLogin, 'dd-MM-yyyy HH:mm')}"></td>
            <td class="text-end text-nowrap">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/users/{id}/edit(id=${i.id})}" th:title="#{common.edit}"><i class="bi bi-pencil"></i></a>
                <form th:action="@{/admin/users/{id}/delete(id=${i.id})}" method="post" class="d-inline" th:attr="data-confirm=#{common.confirmDelete}">
                    <button class="btn btn-sm btn-outline-danger" th:title="#{common.delete}"><i class="bi bi-trash"></i></button></form>
            </td>
        </tr></tbody></table></div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
