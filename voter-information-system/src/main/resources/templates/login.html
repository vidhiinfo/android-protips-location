<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${currentLang.code}" th:dir="${currentLang.rtl} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{login.title})}"></head>
<body class="d-flex align-items-center" style="min-height:100vh">
<div class="container" style="max-width:430px">
    <div class="d-flex justify-content-end mb-2">
        <select th:replace="~{fragments/layout :: langSwitcher('lang-login')}"></select>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="mb-1 text-center"><i class="bi bi-person-vcard text-primary"></i> <span th:text="#{app.name}"></span></h4>
            <p class="text-muted text-center small mb-4" th:text="#{login.subtitle}"></p>
            <div th:if="${param.error != null and param.error[0] == 'assembly'}" class="alert alert-danger py-2" th:text="#{login.error.assembly}"></div>
            <div th:if="${param.error != null and param.error[0] != 'assembly'}" class="alert alert-danger py-2" th:text="#{login.error}"></div>
            <div th:if="${param.logout}" class="alert alert-info py-2" th:text="#{login.loggedOut}"></div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3"><label class="form-label" for="username" th:text="#{login.username}"></label>
                    <div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input id="username" name="username" class="form-control" required autofocus autocomplete="username"></div></div>
                <div class="mb-3"><label class="form-label" for="password" th:text="#{login.password}"></label>
                    <div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input id="password" name="password" type="password" class="form-control" required autocomplete="current-password"></div></div>
                <div class="mb-4"><label class="form-label" for="assemblyNo" th:text="#{login.assembly}"></label>
                    <div class="input-group"><span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                        <select id="assemblyNo" name="assemblyNo" class="form-select">
                            <option value="" th:text="#{login.allAssemblies}"></option>
                            <option th:each="a : ${loginAssemblies}" th:value="${a.key}" th:text="${a.key} + ' - ' + ${a.value}"></option>
                        </select></div>
                    <div class="form-text" th:text="#{login.assemblyHelp}"></div></div>
                <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> <span th:text="#{login.button}"></span></button>
            </form>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
