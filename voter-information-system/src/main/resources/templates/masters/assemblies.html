<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${currentLang.code}" th:dir="${currentLang.rtl} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{master.assemblies})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container-fluid px-3" style="max-width:1300px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex align-items-center mb-3">
        <h4 class="me-auto mb-0"><i class="bi bi-database"></i> <span th:text="#{master.assemblies}"></span></h4>
        <a sec:authorize="hasAuthority('MASTER_EDIT')" class="btn btn-primary btn-sm" th:href="@{/masters/assemblies/new}"><i class="bi bi-plus-lg"></i> <span th:text="#{common.add}"></span></a>
    </div>
    <div class="table-responsive bg-white border rounded"><table class="table table-striped table-hover mb-0">
        <thead class="table-light"><tr><th th:text="#{col.assemblyNo}"></th><th th:text="#{col.assemblyName}"></th><th th:text="#{master.nameLocal}"></th>
            <th th:text="#{col.district}"></th><th th:text="#{master.state}"></th><th th:text="#{master.reservedFor}"></th><th sec:authorize="hasAuthority('MASTER_EDIT')"></th></tr></thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(items)}"><td colspan="7" class="text-center text-muted py-4" th:text="#{common.noRecords}"></td></tr>
            <tr th:each="i : ${items}">
                <td th:text="${i.assemblyNo}"></td><td th:text="${i.name}"></td><td dir="auto" th:text="${i.nameLocal}"></td>
                <td th:text="${i.district}"></td><td th:text="${i.state}"></td><td th:text="${i.reservedFor}"></td>
                <td class="text-end text-nowrap" sec:authorize="hasAuthority('MASTER_EDIT')">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/masters/assemblies/{id}/edit(id=${i.id})}" th:title="#{common.edit}"><i class="bi bi-pencil"></i></a>
                    <form th:action="@{/masters/assemblies/{id}/delete(id=${i.id})}" method="post" class="d-inline" th:attr="data-confirm=#{common.confirmDelete}">
                        <button class="btn btn-sm btn-outline-danger" th:title="#{common.delete}"><i class="bi bi-trash"></i></button></form>
                </td>
            </tr>
        </tbody></table></div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
