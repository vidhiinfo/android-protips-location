<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${currentLang.code}" th:dir="${currentLang.rtl} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{master.elections})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container-fluid px-3" style="max-width:1300px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex align-items-center mb-3">
        <h4 class="me-auto mb-0"><i class="bi bi-database"></i> <span th:text="#{master.elections}"></span></h4>
        <a sec:authorize="hasRole('ADMIN')" class="btn btn-primary btn-sm" th:href="@{/masters/elections/new}"><i class="bi bi-plus-lg"></i> <span th:text="#{common.add}"></span></a>
    </div>
    <div class="table-responsive bg-white border rounded"><table class="table table-striped table-hover mb-0">
        <thead class="table-light"><tr><th th:text="#{master.electionName}"></th><th th:text="#{master.electionType}"></th><th th:text="#{master.year}"></th>
            <th th:text="#{master.pollDate}"></th><th th:text="#{master.current}"></th><th sec:authorize="hasRole('ADMIN')"></th></tr></thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(items)}"><td colspan="6" class="text-center text-muted py-4" th:text="#{common.noRecords}"></td></tr>
            <tr th:each="i : ${items}">
                <td><a th:href="@{/results(electionId=${i.id})}" th:text="${i.name}"></a></td>
                <td th:text="#{${'election.type.' + i.type}}"></td><td th:text="${i.year}"></td>
                <td th:text="${#temporals.format(i.pollDate, 'dd-MM-yyyy')}"></td>
                <td><i th:if="${i.current}" class="bi bi-check-circle-fill text-success"></i></td>
                <td class="text-end text-nowrap" sec:authorize="hasRole('ADMIN')">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/masters/elections/{id}/edit(id=${i.id})}" th:title="#{common.edit}"><i class="bi bi-pencil"></i></a>
                    <form th:action="@{/masters/elections/{id}/delete(id=${i.id})}" method="post" class="d-inline" th:attr="data-confirm=#{common.confirmDelete}">
                        <button class="btn btn-sm btn-outline-danger" th:title="#{common.delete}"><i class="bi bi-trash"></i></button></form>
                </td>
            </tr>
        </tbody></table></div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
