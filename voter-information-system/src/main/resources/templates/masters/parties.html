<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${currentLang.code}" th:dir="${currentLang.rtl} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{master.parties})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container-fluid px-3" style="max-width:1300px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex align-items-center mb-3">
        <h4 class="me-auto mb-0"><i class="bi bi-database"></i> <span th:text="#{master.parties}"></span></h4>
        <a sec:authorize="hasRole('ADMIN')" class="btn btn-primary btn-sm" th:href="@{/masters/parties/new}"><i class="bi bi-plus-lg"></i> <span th:text="#{common.add}"></span></a>
    </div>
    <div class="table-responsive bg-white border rounded"><table class="table table-striped table-hover mb-0">
        <thead class="table-light"><tr><th></th><th th:text="#{master.shortName}"></th><th th:text="#{master.partyName}"></th><th th:text="#{master.nameLocal}"></th>
            <th th:text="#{master.symbol}"></th><th sec:authorize="hasRole('ADMIN')"></th></tr></thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(items)}"><td colspan="6" class="text-center text-muted py-4" th:text="#{common.noRecords}"></td></tr>
            <tr th:each="i : ${items}">
                <td><span class="d-inline-block rounded-circle" style="width:14px;height:14px" th:style="'width:14px;height:14px;background:' + (${i.color} ?: '#6c757d')"></span></td>
                <td class="fw-semibold" th:text="${i.shortName}"></td><td th:text="${i.name}"></td><td dir="auto" th:text="${i.nameLocal}"></td><td th:text="${i.symbol}"></td>
                <td class="text-end text-nowrap" sec:authorize="hasRole('ADMIN')">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/masters/parties/{id}/edit(id=${i.id})}" th:title="#{common.edit}"><i class="bi bi-pencil"></i></a>
                    <form th:action="@{/masters/parties/{id}/delete(id=${i.id})}" method="post" class="d-inline" th:attr="data-confirm=#{common.confirmDelete}">
                        <button class="btn btn-sm btn-outline-danger" th:title="#{common.delete}"><i class="bi bi-trash"></i></button></form>
                </td>
            </tr>
        </tbody></table></div>
    <p class="small text-muted mt-2" th:text="#{master.partyHint}"></p>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
