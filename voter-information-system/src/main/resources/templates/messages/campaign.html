<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${currentLang.code}" th:dir="${currentLang.rtl} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(${c.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container-fluid px-3" style="max-width:1300px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div th:if="${silence}" class="alert alert-danger py-2"><i class="bi bi-slash-circle"></i> <span th:text="#{msg.silenceActive(${silence})}"></span></div>
    <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
        <h4 class="me-auto mb-0"><span th:text="${c.name}" dir="auto"></span>
            <span class="badge text-bg-light border fs-6" th:text="#{${'msg.c.' + c.status}}"></span></h4>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/messages/campaigns/{id}(id=${c.id})}"><i class="bi bi-arrow-clockwise"></i> <span th:text="#{msg.refresh}"></span></a>
        <form th:if="${c.status.name() == 'QUEUED' or c.status.name() == 'SENDING'}" method="post" th:action="@{/messages/campaigns/{id}/cancel(id=${c.id})}"
              th:attr="data-confirm=#{msg.confirmCancel}"><button class="btn btn-sm btn-outline-danger"><i class="bi bi-stop-circle"></i> <span th:text="#{msg.cancel}"></span></button></form>
    </div>
    <div class="small text-muted mb-3">
        <span th:text="#{${'msg.channel.' + c.channel}}"></span> &middot; <span th:text="${c.template.name}"></span>
        <span th:if="${c.filterSummary}"> &middot; <span th:text="${c.filterSummary}"></span></span>
        <span th:if="${c.scheduledAt}"> &middot; <span th:text="#{msg.scheduleAt}"></span>: <span th:text="${#temporals.format(c.scheduledAt, 'dd-MM-yyyy HH:mm')}"></span></span>
        &middot; <span th:text="#{msg.createdBy}"></span> <span th:text="${c.createdBy}"></span>
    </div>
    <div th:if="${!windowOpen and (c.status.name() == 'QUEUED' or c.status.name() == 'SENDING')}" class="alert alert-info py-2"
         th:text="#{msg.outsideWindow(${sendFrom}, ${sendUntil})}"></div>
    <div class="row g-2 mb-3">
        <div class="col-6 col-md-2"><div class="stat"><div class="small text-muted" th:text="#{msg.p.recipients}"></div><div class="num" th:text="${c.total}"></div></div></div>
        <div class="col-6 col-md-2"><div class="stat"><div class="small text-muted" th:text="#{msg.s.SENT}"></div><div class="num text-success" th:text="${c.sent}"></div></div></div>
        <div class="col-6 col-md-2"><div class="stat"><div class="small text-muted" th:text="#{msg.s.FAILED}"></div><div class="num text-danger" th:text="${c.failed}"></div></div></div>
        <div class="col-6 col-md-2"><div class="stat"><div class="small text-muted" th:text="#{msg.s.SKIPPED}"></div><div class="num" th:text="${c.skipped}"></div></div></div>
        <div class="col-6 col-md-2"><div class="stat"><div class="small text-muted" th:text="#{msg.s.QUEUED}"></div><div class="num" th:text="${c.pending}"></div></div></div>
        <div class="col-6 col-md-2"><div class="stat"><div class="small text-muted" th:text="#{msg.progress}"></div><div class="num" th:text="${c.progress} + '%'"></div></div></div>
    </div>
    <div class="card mb-3"><div class="card-body small" dir="auto" style="white-space:pre-wrap" th:text="${c.template.body}"></div></div>
    <div class="d-flex flex-wrap gap-1 mb-2">
        <a class="btn btn-sm" th:classappend="${status == null} ? 'btn-primary' : 'btn-outline-secondary'" th:href="@{/messages/campaigns/{id}(id=${c.id})}" th:text="#{common.all}"></a>
        <a th:each="s : ${statuses}" class="btn btn-sm" th:classappend="${s == status} ? 'btn-primary' : 'btn-outline-secondary'"
           th:href="@{/messages/campaigns/{id}(id=${c.id},status=${s})}" th:text="#{${'msg.s.' + s}}"></a>
    </div>
    <div class="table-responsive bg-white border rounded"><table class="table table-sm table-striped mb-0">
        <thead class="table-light"><tr><th th:text="#{col.name}"></th><th th:text="#{col.mobile}"></th><th th:text="#{admin.status}"></th>
            <th th:text="#{msg.attempts}"></th><th th:text="#{msg.providerId}"></th><th th:text="#{admin.details}"></th><th th:text="#{admin.time}"></th></tr></thead>
        <tbody>
            <tr th:if="${page.empty}"><td colspan="7" class="text-center text-muted py-3" th:text="#{common.noRecords}"></td></tr>
            <tr th:each="o : ${page.content}">
                <td><a th:if="${o.voterId}" th:href="@{/voters/{id}(id=${o.voterId})}" th:text="${o.voterName}"></a></td>
                <td class="text-nowrap" th:text="${o.maskedMobile}"></td>
                <td><span class="badge" th:classappend="${o.status.name() == 'SENT'} ? 'text-bg-success' : (${o.status.name() == 'FAILED'} ? 'text-bg-danger' : 'text-bg-light border')"
                          th:text="#{${'msg.s.' + o.status}}"></span></td>
                <td th:text="${o.attempts}"></td>
                <td class="small" th:text="${o.providerId}"></td>
                <td class="small text-danger" th:text="${o.error}"></td>
                <td class="small text-nowrap" th:text="${#temporals.format(o.sentAt, 'dd-MM HH:mm:ss')}"></td>
            </tr>
        </tbody></table></div>
    <nav th:if="${page.totalPages > 1}" class="mt-3 d-flex justify-content-center gap-2">
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${page.first} ? 'disabled'" th:href="@{/messages/campaigns/{id}(id=${c.id},status=${status},page=${page.number - 1})}">&lsaquo;</a>
        <span class="small align-self-center" th:text="(${page.number} + 1) + ' / ' + ${page.totalPages}"></span>
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${page.last} ? 'disabled'" th:href="@{/messages/campaigns/{id}(id=${c.id},status=${status},page=${page.number + 1})}">&rsaquo;</a>
    </nav>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
