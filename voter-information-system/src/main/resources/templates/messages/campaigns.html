<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${currentLang.code}" th:dir="${currentLang.rtl} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{msg.campaigns})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container-fluid px-3" style="max-width:1300px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div th:if="${silence}" class="alert alert-danger py-2"><i class="bi bi-slash-circle"></i> <span th:text="#{msg.silenceActive(${silence})}"></span></div>
    <div class="d-flex align-items-center mb-3">
        <h4 class="me-auto mb-0"><i class="bi bi-chat-dots"></i> <span th:text="#{msg.campaigns}"></span></h4>
        <a class="btn btn-sm btn-primary" th:href="@{/voters}"><i class="bi bi-plus-lg"></i> <span th:text="#{msg.new}"></span></a>
    </div>
    <p class="small text-muted" th:text="#{msg.howTo}"></p>
    <div class="table-responsive bg-white border rounded"><table class="table table-striped table-hover mb-0 align-middle">
        <thead class="table-light"><tr><th>#</th><th th:text="#{msg.campaignName}"></th><th th:text="#{msg.channel}"></th><th th:text="#{msg.template}"></th>
            <th th:text="#{admin.status}"></th><th style="width:18%" th:text="#{msg.progress}"></th><th class="text-end" th:text="#{msg.s.SENT}"></th>
            <th class="text-end" th:text="#{msg.s.FAILED}"></th><th th:text="#{msg.createdBy}"></th><th th:text="#{admin.time}"></th></tr></thead>
        <tbody>
            <tr th:if="${page.empty}"><td colspan="10" class="text-center text-muted py-4" th:text="#{common.noRecords}"></td></tr>
            <tr th:each="c : ${page.content}">
                <td th:text="${c.id}"></td>
                <td><a th:href="@{/messages/campaigns/{id}(id=${c.id})}" th:text="${c.name}" dir="auto"></a></td>
                <td><i th:class="${c.channel.name() == 'SMS'} ? 'bi bi-chat-text' : 'bi bi-whatsapp text-success'"></i> <span th:text="#{${'msg.channel.' + c.channel}}"></span></td>
                <td class="small" th:text="${c.template.name}"></td>
                <td><span class="badge text-bg-light border" th:text="#{${'msg.c.' + c.status}}"></span></td>
                <td><div class="progress" style="height:.6rem"><div class="progress-bar" th:style="'width:' + ${c.progress} + '%'"></div></div>
                    <span class="small text-muted" th:text="(${c.total} - ${c.pending}) + ' / ' + ${c.total}"></span></td>
                <td class="text-end" th:text="${c.sent}"></td><td class="text-end" th:text="${c.failed}"></td>
                <td th:text="${c.createdBy}"></td><td class="small" th:text="${#temporals.format(c.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
            </tr>
        </tbody></table></div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
