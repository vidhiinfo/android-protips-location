<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${currentLang.code}" th:dir="${currentLang.rtl} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{msg.optouts})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container" style="max-width:1000px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div th:if="${silence}" class="alert alert-danger py-2"><i class="bi bi-slash-circle"></i> <span th:text="#{msg.silenceActive(${silence})}"></span></div>
    <h4 class="mb-2"><i class="bi bi-bell-slash"></i> <span th:text="#{msg.optouts}"></span></h4>
    <p class="small text-muted" th:text="#{msg.optoutHelp}"></p>
    <form method="post" th:action="@{/messages/optouts}" class="card card-body mb-3"><div class="row g-2 align-items-end">
        <div class="col-md-3"><label class="form-label small" th:text="#{col.mobile}"></label><input name="mobile" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label small" th:text="#{msg.channel}"></label>
            <select name="channel" class="form-select"><option value="" th:text="#{msg.allChannels}"></option>
                <option th:each="c : ${channels}" th:value="${c}" th:text="#{${'msg.channel.' + c}}"></option></select></div>
        <div class="col-md-4"><label class="form-label small" th:text="#{msg.reason}"></label><input name="reason" class="form-control" maxlength="200" dir="auto"></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" th:text="#{common.add}"></button></div>
    </div></form>
    <div class="table-responsive bg-white border rounded"><table class="table table-sm table-striped mb-0">
        <thead class="table-light"><tr><th th:text="#{col.mobile}"></th><th th:text="#{msg.channel}"></th><th th:text="#{msg.reason}"></th>
            <th th:text="#{msg.createdBy}"></th><th th:text="#{admin.time}"></th><th></th></tr></thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(items)}"><td colspan="6" class="text-center text-muted py-3" th:text="#{common.noRecords}"></td></tr>
            <tr th:each="o : ${items}">
                <td th:text="${o.mobile}"></td><td th:text="${o.channel} ? #{${'msg.channel.' + o.channel}} : #{msg.allChannels}"></td>
                <td dir="auto" th:text="${o.reason}"></td><td th:text="${o.createdBy}"></td>
                <td class="small" th:text="${#temporals.format(o.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
                <td class="text-end"><form th:action="@{/messages/optouts/{id}/delete(id=${o.id})}" method="post" th:attr="data-confirm=#{common.confirmDelete}">
                    <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form></td>
            </tr>
        </tbody></table></div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
