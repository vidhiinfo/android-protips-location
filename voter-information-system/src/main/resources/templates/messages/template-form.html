<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${currentLang.code}" th:dir="${currentLang.rtl} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{msg.template})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container" style="max-width:950px">
    <h4 class="mb-3" th:text="#{msg.template}"></h4>
    <form th:object="${item}" method="post" th:action="@{/messages/templates}" class="card" novalidate>
        <div class="card-body row g-3">
            <input type="hidden" th:field="*{id}">
            <div th:replace="~{fragments/form :: input('name', 'msg.templateName', 'col-md-6', 'text', true)}"></div>
            <div class="col-md-3"><label class="form-label" th:text="#{msg.channel}"></label>
                <select th:field="*{channel}" class="form-select"><option th:each="c : ${channels}" th:value="${c}" th:text="#{${'msg.channel.' + c}}"></option></select></div>
            <div class="col-md-3"><label class="form-label" th:text="#{nav.language}"></label>
                <select th:field="*{language}" class="form-select"><option th:each="l : ${langs}" th:value="${l.code}" th:text="${l.nativeName}"></option></select></div>
            <div class="col-12"><label class="form-label" th:text="#{msg.body}"></label>
                <textarea th:field="*{body}" rows="5" class="form-control" dir="auto" maxlength="1000" th:errorclass="is-invalid"></textarea>
                <div class="invalid-feedback" th:errors="*{body}"></div>
                <div class="form-text"><span th:text="#{msg.placeholders}"></span>
                    <code th:each="p : ${placeholders}" th:text="'{' + ${p} + '} '"></code></div></div>
            <div th:replace="~{fragments/form :: input('providerTemplateId', 'msg.providerTemplateId', 'col-md-6', 'text', false)}"></div>
            <div th:replace="~{fragments/form :: input('params', 'msg.params', 'col-md-6', 'text', false)}"></div>
            <div class="col-12 form-text mt-0" th:text="#{msg.providerHelp}"></div>
            <div class="col-12"><div class="form-check">
                <input type="checkbox" th:field="*{active}" class="form-check-input">
                <label class="form-check-label" th:for="${#ids.prev('active')}" th:text="#{admin.active}"></label></div></div>
        </div>
        <div class="card-footer d-flex gap-2">
            <button class="btn btn-primary"><i class="bi bi-check-lg"></i> <span th:text="#{common.save}"></span></button>
            <a class="btn btn-outline-secondary" th:href="@{/messages/templates}" th:text="#{common.cancel}"></a>
        </div>
    </form>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
