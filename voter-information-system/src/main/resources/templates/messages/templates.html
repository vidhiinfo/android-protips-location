<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${currentLang.code}" th:dir="${currentLang.rtl} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{msg.templates})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container-fluid px-3" style="max-width:1300px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div th:if="${silence}" class="alert alert-danger py-2"><i class="bi bi-slash-circle"></i> <span th:text="#{msg.silenceActive(${silence})}"></span></div>
    <div class="d-flex align-items-center mb-3">
        <h4 class="me-auto mb-0"><i class="bi bi-card-text"></i> <span th:text="#{msg.templates}"></span></h4>
        <a class="btn btn-sm btn-primary" th:href="@{/messages/templates/new}"><i class="bi bi-plus-lg"></i> <span th:text="#{common.add}"></span></a>
    </div>
    <div class="table-responsive bg-white border rounded"><table class="table table-striped mb-0 align-middle">
        <thead class="table-light"><tr><th th:text="#{msg.channel}"></th><th th:text="#{nav.language}"></th><th th:text="#{msg.templateName}"></th>
            <th th:text="#{msg.body}"></th><th th:text="#{msg.providerTemplateId}"></th><th th:text="#{admin.status}"></th><th></th></tr></thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(items)}"><td colspan="7" class="text-center text-muted py-4" th:text="#{common.noRecords}"></td></tr>
            <tr th:each="i : ${items}">
                <td th:text="#{${'msg.channel.' + i.channel}}"></td><td th:text="${i.language}"></td><td class="fw-semibold" th:text="${i.name}"></td>
                <td class="small" dir="auto" style="max-width:420px" th:text="${i.body}"></td>
                <td class="small" th:text="${i.providerTemplateId}"></td>
                <td><span th:class="${i.active} ? 'badge text-bg-success' : 'badge text-bg-secondary'" th:text="${i.active} ? #{admin.active} : #{admin.disabled}"></span></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/messages/templates/{id}/edit(id=${i.id})}"><i class="bi bi-pencil"></i></a>
                    <form th:action="@{/messages/templates/{id}/delete(id=${i.id})}" method="post" class="d-inline" th:attr="data-confirm=#{common.confirmDelete}">
                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form>
                </td>
            </tr>
        </tbody></table></div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
