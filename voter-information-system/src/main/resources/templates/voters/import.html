<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${currentLang.code}" th:dir="${currentLang.rtl} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{nav.import})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container" style="max-width:850px">
    <h4 class="mb-3" th:text="#{import.title}"></h4>
    <div class="card mb-3"><div class="card-body">
        <ol class="mb-3">
            <li><a th:href="@{/voters/import/template}" th:text="#{import.step1}"></a></li>
            <li th:text="#{import.step2}"></li>
            <li th:text="#{import.step3}"></li>
            <li th:text="#{import.step4}"></li>
        </ol>
        <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
        <form th:action="@{/voters/import}" method="post" enctype="multipart/form-data" class="d-flex gap-2">
            <input type="file" name="file" accept=".xlsx" class="form-control" required>
            <button class="btn btn-primary text-nowrap"><i class="bi bi-upload"></i> <span th:text="#{import.upload}"></span></button>
        </form>
    </div></div>

    <div th:if="${result}" class="card">
        <div class="card-body">
            <h6 th:text="#{import.result}"></h6>
            <p class="mb-2"><span class="badge text-bg-success" th:text="#{import.added(${result.inserted})}"></span>
                <span class="badge text-bg-primary" th:text="#{import.updated(${result.updated})}"></span>
                <span class="badge text-bg-danger" th:text="#{import.errors(${#lists.size(result.errors)})}"></span></p>
            <ul th:unless="${#lists.isEmpty(result.errors)}" class="small text-danger mb-0">
                <li th:each="e : ${result.errors}" th:text="${e}"></li>
            </ul>
            <a th:href="@{/voters}" class="btn btn-sm btn-outline-primary mt-2" th:text="#{import.goToList}"></a>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
